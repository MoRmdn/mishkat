name: mishkat
description: "Athkar reminders that arrive on time — fully offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  hijri: ^3.0.1
  wakelock_plus: ^1.8.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  permission_handler: ^12.0.0
  device_info_plus: ^13.2.0
  app_settings: ^9.0.0

# permission_handler_android 13.x declares in its AAR metadata that consumers
# must compile against Android API 37. That platform is not published yet, and
# Android Gradle Plugin 9 caps compileSdk at 36 — the two cannot both be
# satisfied. 12.1.0 targets 34 and exposes the same permissions we use.
# Remove this override once API 37 ships.
dependency_overrides:
  permission_handler_android: 12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  wakelock_plus_platform_interface: ^1.7.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
          weight: 400
