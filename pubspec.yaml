name: mishkat
description: "Athkar reminders that arrive on time — fully offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  hijri: ^3.0.1
  wakelock_plus: ^1.8.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  permission_handler: ^12.0.0
  device_info_plus: ^13.2.0
  app_settings: ^9.0.0
  adhan: ^2.0.0+1
  geolocator: ^14.0.3
  drift: ^2.34.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  screenshot: ^3.0.0
  share_plus: ^13.3.0
  path: ^1.9.1
  firebase_core: ^4.15.0
  app_links: ^7.2.1
  url_launcher: ^6.3.2
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_app_check: ^0.4.8
  google_sign_in: ^7.2.0
  package_info_plus: ^10.2.1

# permission_handler_android 13.x declares in its AAR metadata that consumers
# must compile against Android API 37. That platform is not published yet, and
# Android Gradle Plugin 9 caps compileSdk at 36 — the two cannot both be
# satisfied. 12.1.0 targets 34 and exposes the same permissions we use.
# Remove this override once API 37 ships.
dependency_overrides:
  permission_handler_android: 12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  wakelock_plus_platform_interface: ^1.7.0
  plugin_platform_interface: ^2.1.8
  drift_dev: ^2.34.6
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.9.2
  fake_cloud_firestore: ^4.3.0

# Platform icons and launch screen, from the 2a handoff's exports in
# assets/branding/png (source files only — not bundled into the app).
#
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
#
# The launcher generator writes iOS icons and the legacy Android mipmaps only.
# Android's adaptive and themed icon is the vector set under
# android/app/src/main/res (drawable/ic_launcher_{foreground,monochrome}.xml);
# do not add adaptive_icon_* keys here, and delete any density-qualified
# ic_launcher_foreground.png a generator leaves behind — it would override
# the vectors.
#
# Colours are MishkatTokens values (light.bg, dark.bg); test/branding_test.dart
# fails if they drift from lib/core/theme/mishkat_tokens.dart.
flutter_launcher_icons:
  image_path: assets/branding/png/app-icon-ios-1024.png
  android: ic_launcher
  ios: true
  remove_alpha_ios: true
  image_path_ios_dark_transparent: assets/branding/png/app-icon-ios-dark-transparent-1024.png
  image_path_ios_tinted_grayscale: assets/branding/png/app-icon-ios-tinted-1024.png
  desaturate_tinted_to_grayscale_ios: true

flutter_native_splash:
  color: "#EFEBE7"
  color_dark: "#1B1320"
  image: assets/branding/png/splash-mark-1152.png
  image_dark: assets/branding/png/splash-mark-dark-1152.png
  android_12:
    color: "#EFEBE7"
    color_dark: "#1B1320"
    image: assets/branding/png/splash-mark-1152.png
    image_dark: assets/branding/png/splash-mark-dark-1152.png
  fullscreen: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/icons/
    # Only the marks the app draws at runtime. The rest of the brand kit lives
    # in the design handoff; assets/branding/png holds generator inputs.
    - assets/branding/svg/symbol-color.svg
    - assets/branding/svg/symbol-small-color.svg
    # Sign in with Apple / Google marks, drawn at the providers' own colours.
    - assets/branding/providers/

  fonts:
    # UI. Static instances of the official variable font — see
    # assets/fonts/README.md.
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Light.ttf
          weight: 300
        - asset: assets/fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
    # Athkar text.
    - family: Scheherazade New
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
          weight: 400
        - asset: assets/fonts/ScheherazadeNew-Medium.ttf
          weight: 500
    # Behind the "Quranic script" setting.
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
          weight: 400
