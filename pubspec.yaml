name: mishkat
description: "Athkar reminders that arrive on time — fully offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  hijri: ^3.0.1
  wakelock_plus: ^1.8.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  permission_handler: ^12.0.0
  device_info_plus: ^13.2.0
  app_settings: ^9.0.0
  adhan: ^2.0.0+1
  geolocator: ^14.0.3
  drift: ^2.34.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  screenshot: ^3.0.0
  share_plus: ^13.3.0
  path: ^1.9.1
  firebase_core: ^4.14.0

# permission_handler_android 13.x declares in its AAR metadata that consumers
# must compile against Android API 37. That platform is not published yet, and
# Android Gradle Plugin 9 caps compileSdk at 36 — the two cannot both be
# satisfied. 12.1.0 targets 34 and exposes the same permissions we use.
# Remove this override once API 37 ships.
dependency_overrides:
  permission_handler_android: 12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  wakelock_plus_platform_interface: ^1.7.0
  plugin_platform_interface: ^2.1.8
  drift_dev: ^2.34.6
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.9.2

# Generates the platform icon sets. Build the source art first:
#   dart run tool/build_branding.dart
# then:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/app-icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # The teal build's deep ink, so the adaptive icon's background matches the
  # mark rather than showing white corners.
  adaptive_icon_background: "#123A31"
  # The mark alone, sized for the adaptive safe zone — the full icon would be
  # cropped into by Android's mask.
  adaptive_icon_foreground: assets/branding/adaptive-foreground.png

# Launch screen. Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  # The teal build's deep ink, so launch flows into the app rather than
  # flashing white first.
  color: "#123A31"
  color_dark: "#0E1613"
  image: assets/branding/splash-mark.png
  image_dark: assets/branding/splash-mark.png
  android_12:
    color: "#123A31"
    color_dark: "#0E1613"
    image: assets/branding/splash-mark.png
    image_dark: assets/branding/splash-mark.png

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/branding/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
          weight: 400
